services:
  - type: web
    name: autotara
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MODEL_PROVIDER
        value: gemini
      - key: MODEL_NAME
        value: gemini-2.0-flash
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: MAX_RUNS_PER_MINUTE
        value: "3"
